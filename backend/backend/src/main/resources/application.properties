# Allow React (port 3000) to call our API
spring.web.cors.allowed-origins=http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# ServiceNow auth
# servicenow.auth-mode=oauth uses the OAuth password grant with client credentials.
# servicenow.auth-mode=basic uses basic auth with the username/password below.
# If auth-mode is oauth but client credentials are missing, the app falls back to basic auth.
servicenow.auth-mode=${SERVICENOW_AUTH_MODE:oauth}
# Set SERVICENOW_CLIENT_ID/SERVICENOW_CLIENT_SECRET from the OAuth app in ServiceNow.
# Set SERVICENOW_USERNAME/SERVICENOW_PASSWORD to a ServiceNow user with access to the incident table.
servicenow.instance-url=https://dev207663.service-now.com
servicenow.oauth.token-url=${servicenow.instance-url}/oauth_token.do
servicenow.oauth.client-id=${SERVICENOW_CLIENT_ID:}
servicenow.oauth.client-secret=${SERVICENOW_CLIENT_SECRET:}
servicenow.oauth.username=${SERVICENOW_USERNAME:}
servicenow.oauth.password=${SERVICENOW_PASSWORD:}
# Provide comma-separated CI names to filter incidents (preferred).
servicenow.incident.ci-names=${SERVICENOW_CI_NAMES:3D Pinball,Acrobat,Adobe Acrobat,Apache,Apache Tomcat,Blackberry,BitTorrent,Desktop,Imaging,PGPadmin}
# Optional comma-separated CI sys_ids to filter incidents (overrides CI names when set).
servicenow.incident.ci-sys-ids=${SERVICENOW_CI_SYS_IDS:0c43baaac61122750182c132ee74bcf0,0c43d67fc61122750182c13265645d9d,46b675d9a9fe19810183a41c76977524,10678ee3c611227501f6dc6126e6da88,469faf48a9fe19810053d29b68f232cb,27d3f35cc0a8000b001df42d019a418f,46d1678da9fe1981002e4344bfd2c755,0c43c2d7c61122750182c132c0e69cb5,0c43c75cc61122750182c13255c76160,46a405a2a9fe198100e07fc8a67588b7}
# Fallback CI sys_id if names are not provided.
servicenow.incident.ci-sys-id=0c43baaac61122750182c132ee74bcf0
servicenow.poll-interval-ms=300000
servicenow.log.retention=100
# ServiceNow assignment controls (disabled by default).
servicenow.assignment.enabled=${SERVICENOW_ASSIGNMENT_ENABLED:false}

# SMS notifications (Twilio) for assignments.
sms.enabled=${SMS_ENABLED:false}
sms.twilio.account-sid=${SMS_TWILIO_ACCOUNT_SID:}
sms.twilio.auth-token=${SMS_TWILIO_AUTH_TOKEN:}
sms.twilio.from-number=${SMS_TWILIO_FROM_NUMBER:}
