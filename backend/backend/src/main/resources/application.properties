spring.application.name=backend

# PostgreSQL DB connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Team_Incident_Management}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Jalaram756@}

# Use Flyway for schema changes and let Hibernate validate the mapped structure.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:1}
spring.flyway.baseline-description=${FLYWAY_BASELINE_DESCRIPTION:Pre-Flyway Hibernate Schema}
# Production briefly applied a removed visitor analytics migration as V11.
# Ignore missing applied migrations so newer schema versions can continue safely.
spring.flyway.ignore-migration-patterns=${FLYWAY_IGNORE_MIGRATION_PATTERNS:*:missing}

# JWT Secret (Base64-encoded; replace in production)
jwt.secret=${JWT_SECRET:hvLc8p+l83NtGyqhkRvldn0Z8+A2J68dnIF0kc5CckoLaP5K4o/kGDsZyN3I1jQ0FWl1bYpprmutbJXz9i8pRw==}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Allow frontend clients to call the API
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
spring.web.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
spring.web.cors.allowed-headers=${CORS_ALLOWED_HEADERS:*}

